<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Hub</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1><span class="title-main">Football</span> <span class="title-accent">Hub</span></h1>
  <div class="header-flourish"><span class="flourish-line left"></span><span class="flourish-line right"></span></div>
</header>

<main>
  <div class="main-tabs">
    <button class="main-tab active" data-target="page-standings">Standings</button>
    <button class="main-tab" data-target="page-matches-hub">Matches</button>
    <button class="main-tab" data-target="page-history">Title History</button>
    <button class="main-tab" data-target="page-squads">Squads</button>
    <button class="main-tab" data-target="page-search">Player Search</button>
    <button class="main-tab" data-target="page-builder">Squad Builder</button>
    <button class="main-tab" data-target="page-map">Map</button>
  </div>

  <!-- STANDINGS PAGE -->
  <section id="page-standings" class="page">
    <div class="tabs" id="standings-tabs"></div>
    <div id="standings-panels"></div>
  </section>

  <!-- FIXTURES / WHAT'S ON PAGE -->
  <!-- MATCHES HUB: Today / Upcoming / Season, filterable by league and team across all competitions -->
  <section id="page-matches-hub" class="page hidden">
    <div class="mh-filters">
      <select id="mh-league-filter">
        <option value="">All Leagues</option>
      </select>
      <select id="mh-team-filter">
        <option value="">All Teams</option>
      </select>
    </div>

    <div class="tabs" id="mh-view-tabs">
      <button class="tab mh-view-tab active" data-view="today">Today</button>
      <button class="tab mh-view-tab" data-view="upcoming">Upcoming</button>
      <button class="tab mh-view-tab" data-view="season">Season</button>
    </div>

    <div id="mh-today-view">
      <div id="mh-today-list"></div>
    </div>

    <div id="mh-upcoming-view" class="hidden">
      <div class="mh-date-strip" id="mh-date-strip"></div>
      <div id="mh-upcoming-list"></div>
    </div>

    <div id="mh-season-view" class="hidden">
      <div id="mh-season-list"></div>
    </div>
  </section>

  <!-- TITLE HISTORY PAGE -->
  <section id="page-history" class="page hidden">
    <div class="tabs" id="history-tabs"></div>
    <div id="history-list" class="history-list"></div>
  </section>

  <!-- SQUADS PAGE -->
  <section id="page-squads" class="page hidden">
    <div class="tabs" id="squads-tabs"></div>
    <div id="squads-team-select-wrap" class="squads-team-select-wrap hidden">
      <select id="squads-team-select"></select>
    </div>
    <div id="squads-team-header" class="squads-team-header"></div>
    <div id="squads-list" class="squads-list"></div>
  </section>

  <!-- PLAYER SEARCH PAGE -->
  <section id="page-search" class="page hidden">
    <input type="text" id="player-search-input" class="player-search-input" placeholder="Search for a player...">
    <div id="player-search-results" class="player-search-results"></div>
  </section>

  <!-- SQUAD BUILDER PAGE -->
  <section id="page-builder" class="page hidden">
    <div class="builder-toolbar">
      <div class="builder-formations" id="builder-formations">
        <button class="formation-btn active" data-f="4-3-3">4-3-3</button>
        <button class="formation-btn" data-f="4-4-2">4-4-2</button>
        <button class="formation-btn" data-f="4-2-3-1">4-2-3-1</button>
        <button class="formation-btn" data-f="3-5-2">3-5-2</button>
        <button class="formation-btn" data-f="5-3-2">5-3-2</button>
        <button class="formation-btn" data-f="3-4-3">3-4-3</button>
        <button class="formation-btn" data-f="4-1-4-1">4-1-4-1</button>
        <button class="formation-btn" data-f="5-4-1">5-4-1</button>
      </div>
      <span class="builder-count" id="builder-count">0 / 11</span>
      <button class="builder-clear-btn" id="builder-clear-btn">Clear All</button>
    </div>
    <div class="builder-main">
      <div class="builder-pitch-wrap">
        <div class="builder-pitch" id="builder-pitch">
          <div class="pitch-centre-circle"></div>
          <div class="pitch-box-top"></div>
          <div class="pitch-box-bot"></div>
          <div class="pitch-small-top"></div>
          <div class="pitch-small-bot"></div>
        </div>
      </div>
      <div class="builder-picker" id="builder-picker">
        <div class="builder-picker-header">
          <div class="builder-picker-title" id="builder-picker-title">Player Picker</div>
          <div class="builder-picker-hint" id="builder-picker-hint"></div>
          <input type="text" id="builder-picker-search" placeholder="Search players...">
          <div class="builder-picker-selects">
            <select id="builder-league-filter">
              <option value="">All Leagues</option>
            </select>
            <select id="builder-team-filter">
              <option value="">All Teams</option>
            </select>
          </div>
        </div>
        <div class="builder-picker-filters" id="builder-picker-filters">
          <button class="pf-btn active" data-pg="ALL">All</button>
          <button class="pf-btn" data-pg="GK">GK</button>
          <button class="pf-btn" data-pg="DEF">DEF</button>
          <button class="pf-btn" data-pg="MID">MID</button>
          <button class="pf-btn" data-pg="FWD">FWD</button>
        </div>
        <div class="builder-picker-list" id="builder-picker-list">
          <div class="builder-picker-idle" id="builder-picker-idle">Click any position on the pitch, then pick any player from any team to build your XI</div>
        </div>
      </div>
    </div>
  </section>

  <!-- MAP PAGE -->
  <section id="page-map" class="page hidden">
    <div class="map-wrap">
      <div class="map-region-sidebar" id="map-region-sidebar">
        <button class="map-region-btn active" data-region="world">World</button>
      </div>
      <div class="map-main-col">
        <div id="map-viewport" class="map-viewport">
          <div class="map-loading" id="map-loading">Loading map...</div>
          <div id="map-stage" class="map-stage"></div>
          <div class="map-zoom-controls">
            <button id="map-zoom-in" class="map-zoom-btn">+</button>
            <button id="map-zoom-out" class="map-zoom-btn">&minus;</button>
            <button id="map-zoom-reset" class="map-zoom-btn map-zoom-reset">Reset</button>
          </div>
        </div>
        <div class="map-tooltip hidden" id="map-tooltip"></div>
        <div class="map-hint">Drag to pan &middot; scroll to zoom &middot; click a crest for that club</div>
      </div>
    </div>
    <div class="map-legend-wrap">
      <div class="map-legend-title">Leagues</div>
      <div class="globe-legend" id="map-legend"></div>
    </div>
  </section>
</main>

<!-- CLUB PAGE MODAL -->
<div id="club-modal" class="club-modal hidden">
  <div class="club-modal-backdrop" id="club-modal-backdrop"></div>
  <div class="club-modal-panel" id="club-modal-panel">
    <button class="club-modal-close" id="club-modal-close">&#10005;</button>
    <div id="club-modal-body" class="club-modal-body"></div>
  </div>
</div>

<!-- MATCH COMPARISON MODAL -->
<div id="matchup-modal" class="club-modal hidden">
  <div class="club-modal-backdrop" id="matchup-modal-backdrop"></div>
  <div class="club-modal-panel matchup-panel" id="matchup-modal-panel">
    <button class="club-modal-close" id="matchup-modal-close">&#10005;</button>
    <div id="matchup-modal-body" class="club-modal-body"></div>
  </div>
</div>

<script>
  // Top-level page nav
  document.querySelectorAll(".main-tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll(".main-tab").forEach(function (t) { t.classList.remove("active"); });
      document.querySelectorAll(".page").forEach(function (p) { p.classList.add("hidden"); });
      tab.classList.add("active");
      document.getElementById(tab.dataset.target).classList.remove("hidden");
    });
  });
</script>

<script src="competitions.js"></script>
<script src="standings.js"></script>
<script src="matcheshub.js"></script>
<script src="history.js"></script>
<script src="squads.js"></script>
<script src="players.js"></script>
<script src="teambuilder.js"></script>
<script src="clubpage.js"></script>
<script src="matchup.js"></script>
<script src="map.js"></script>

</body>
</html>
