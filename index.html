<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Football Hub</h1>
</header>

<main>
  <div class="main-tabs">
    <button class="main-tab active" data-target="page-standings">Standings</button>
    <button class="main-tab" data-target="page-fixtures">What's On</button>
    <button class="main-tab" data-target="page-matches">Matches</button>
    <button class="main-tab" data-target="page-history">Title History</button>
    <button class="main-tab" data-target="page-squads">Squads</button>
    <button class="main-tab" data-target="page-search">Player Search</button>
  </div>

  <!-- STANDINGS PAGE -->
  <section id="page-standings" class="page">
    <div class="tabs">
      <button class="tab active" data-target="panel-epl">Premier League</button>
      <button class="tab" data-target="panel-laliga">La Liga</button>
      <button class="tab" data-target="panel-seriea">Serie A</button>
      <button class="tab" data-target="panel-ligue1">Ligue 1</button>
      <button class="tab" data-target="panel-bundesliga">Bundesliga</button>
      <button class="tab" data-target="panel-mls">MLS</button>
    </div>

    <div id="panel-epl" class="panel">
      <div id="widget-epl" class="scoreaxis-widget"
           data-src="https://widgets.scoreaxis.com/api/football/league-table/6232265abf1fa71a672159ec?widgetId=epl&lang=en&teamLogo=1&tableLines=0&homeAway=1&header=1&position=1&goals=1&gamesCount=1&diff=1&winCount=1&drawCount=1&loseCount=1&lastGames=1&points=1&teamsLimit=all&links=1&font=heebo&fontSize=14&rowDensity=100&widgetWidth=auto&widgetHeight=auto&bodyColor=%23111111&textColor=%23ffffff&linkColor=%2330d158&borderColor=%232a2a2a&tabColor=%231d1d1d"
           style="width: auto;height: auto;font-size: 14px;background-color: #111111;color: #ffffff;border: none;overflow: auto;">
        <div class="widget-main-link" style="padding: 6px 12px;font-weight: 500;">Live data by <a href="https://www.scoreaxis.com/" style="color: inherit;">Scoreaxis</a></div>
      </div>
    </div>

    <div id="panel-laliga" class="panel hidden">
      <div id="widget-laliga" class="scoreaxis-widget"
           data-src="https://widgets.scoreaxis.com/api/football/league-table/62322c053617da0b83221cc6?widgetId=laliga&lang=en&teamLogo=1&tableLines=0&homeAway=1&header=1&position=1&goals=1&gamesCount=1&diff=1&winCount=1&drawCount=1&loseCount=1&lastGames=1&points=1&teamsLimit=all&links=1&font=heebo&fontSize=14&rowDensity=100&widgetWidth=auto&widgetHeight=auto&bodyColor=%23111111&textColor=%23ffffff&linkColor=%2330d158&borderColor=%232a2a2a&tabColor=%231d1d1d"
           style="width: auto;height: auto;font-size: 14px;background-color: #111111;color: #ffffff;border: none;overflow: auto;">
        <div class="widget-main-link" style="padding: 6px 12px;font-weight: 500;">Live data by <a href="https://www.scoreaxis.com/" style="color: inherit;">Scoreaxis</a></div>
      </div>
    </div>

    <div id="panel-seriea" class="panel hidden">
      <div id="widget-seriea" class="scoreaxis-widget"
           data-src="https://widgets.scoreaxis.com/api/football/league-table/62322b827aee66235a2be718?widgetId=seriea&lang=en&teamLogo=1&tableLines=0&homeAway=1&header=1&position=1&goals=1&gamesCount=1&diff=1&winCount=1&drawCount=1&loseCount=1&lastGames=1&points=1&teamsLimit=all&links=1&font=heebo&fontSize=14&rowDensity=100&widgetWidth=auto&widgetHeight=auto&bodyColor=%23111111&textColor=%23ffffff&linkColor=%2330d158&borderColor=%232a2a2a&tabColor=%231d1d1d"
           style="width: auto;height: auto;font-size: 14px;background-color: #111111;color: #ffffff;border: none;overflow: auto;">
        <div class="widget-main-link" style="padding: 6px 12px;font-weight: 500;">Live data by <a href="https://www.scoreaxis.com/" style="color: inherit;">Scoreaxis</a></div>
      </div>
    </div>

    <div id="panel-ligue1" class="panel hidden">
      <div id="widget-ligue1" class="scoreaxis-widget"
           data-src="https://widgets.scoreaxis.com/api/football/league-table/62322b4efd209951602c9096?widgetId=ligue1&lang=en&teamLogo=1&tableLines=0&homeAway=1&header=1&position=1&goals=1&gamesCount=1&diff=1&winCount=1&drawCount=1&loseCount=1&lastGames=1&points=1&teamsLimit=all&links=1&font=heebo&fontSize=14&rowDensity=100&widgetWidth=auto&widgetHeight=auto&bodyColor=%23111111&textColor=%23ffffff&linkColor=%2330d158&borderColor=%232a2a2a&tabColor=%231d1d1d"

        <div class="widget-main-link" style="padding: 6px 12px;font-weight: 500;">Live data by <a href="https://www.scoreaxis.com/" style="color: inherit;">Scoreaxis</a></div>

    </div>

    <div id="panel-bundesliga" class="panel hidden">
      <div id="widget-bundesliga" class="scoreaxis-widget"
           data-src="https://widgets.scoreaxis.com/api/football/league-table/62321f50f7016c22d3650732?widgetId=bundesliga&lang=en&teamLogo=1&tableLines=0&homeAway=1&header=1&position=1&goals=1&gamesCount=1&diff=1&winCount=1&drawCount=1&loseCount=1&lastGames=1&points=1&teamsLimit=all&links=1&font=heebo&fontSize=14&rowDensity=100&widgetWidth=auto&widgetHeight=auto&bodyColor=%23111111&textColor=%23ffffff&linkColor=%2330d158&borderColor=%232a2a2a&tabColor=%231d1d1d"

           data-src="https://widgets.scoreaxis.com/api/football/league-table/62322d88f6e8396290141c10?widgetId=mls&lang=en&teamLogo=1&tableLines=0&homeAway=1&header=1&position=1&goals=1&gamesCount=1&diff=1&winCount=1&drawCount=1&loseCount=1&lastGames=1&points=1&teamsLimit=all&links=1&font=heebo&fontSize=14&rowDensity=100&widgetWidth=auto&widgetHeight=auto&bodyColor=%23111111&textColor=%23ffffff&linkColor=%2330d158&borderColor=%232a2a2a&tabColor=%231d1d1d"

    </div>

  <!-- FIXTURES / WHAT'S ON PAGE -->
  <section id="page-fixtures" class="page hidden">
    <div id="fixture-cards" class="fixture-cards"></div>
  </section>

  <!-- MATCHES PAGE (pick a league, then a game, see its score) -->
  <section id="page-matches" class="page hidden">
    <div class="tabs">
      <button class="tab matches-tab active" data-league="epl">Premier League</button>
      <button class="tab matches-tab" data-league="laliga">La Liga</button>
      <button class="tab matches-tab" data-league="seriea">Serie A</button>
      <button class="tab matches-tab" data-league="ligue1">Ligue 1</button>
      <button class="tab matches-tab" data-league="bundesliga">Bundesliga</button>
      <button class="tab matches-tab" data-league="mls">MLS</button>
    </div>
    <div id="matches-full-list" class="matches-full-list"></div>
  </section>

  <!-- TITLE HISTORY PAGE -->
  <section id="page-history" class="page hidden">
    <div class="tabs">
      <button class="tab history-tab active" data-league="epl">Premier League</button>
      <button class="tab history-tab" data-league="laliga">La Liga</button>
      <button class="tab history-tab" data-league="seriea">Serie A</button>
      <button class="tab history-tab" data-league="ligue1">Ligue 1</button>
      <button class="tab history-tab" data-league="bundesliga">Bundesliga</button>
      <button class="tab history-tab" data-league="mls">MLS</button>
    </div>
    <div id="history-list" class="history-list"></div>
  </section>

  <!-- SQUADS PAGE -->
  <section id="page-squads" class="page hidden">
    <div class="tabs">
      <button class="tab squads-tab active" data-league="epl">Premier League</button>
      <button class="tab squads-tab" data-league="laliga">La Liga</button>
      <button class="tab squads-tab" data-league="seriea">Serie A</button>
      <button class="tab squads-tab" data-league="ligue1">Ligue 1</button>
      <button class="tab squads-tab" data-league="bundesliga">Bundesliga</button>
      <button class="tab squads-tab" data-league="mls">MLS</button>
    </div>
    <div id="squads-team-select-wrap" class="squads-team-select-wrap hidden">
      <select id="squads-team-select"></select>
    </div>
    <div id="squads-list" class="squads-list"></div>
  </section>

  <!-- PLAYER SEARCH PAGE -->
  <section id="page-search" class="page hidden">
    <input type="text" id="player-search-input" class="player-search-input" placeholder="Search for a player...">
    <div id="player-search-results" class="player-search-results"></div>
  </section>
</main>

<script>
  // Lazily inject each standings widget's <script> tag only once its panel is visible.
  function loadWidget(wrapper) {
    if (!wrapper || wrapper.dataset.loaded) return;
    var script = document.createElement("script");
    script.src = wrapper.dataset.src;
    script.async = true;
    wrapper.appendChild(script);
    wrapper.dataset.loaded = "true";
  }

  // Live match widget removed per user request (static match, not useful long-term)

  loadWidget(document.getElementById("widget-epl"));

  document.querySelectorAll("#page-standings .tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll("#page-standings .tab").forEach(function (t) { t.classList.remove("active"); });
      document.querySelectorAll("#page-standings .panel").forEach(function (p) { p.classList.add("hidden"); });
      tab.classList.add("active");
      var targetPanel = document.getElementById(tab.dataset.target);
      targetPanel.classList.remove("hidden");
      loadWidget(targetPanel.querySelector(".scoreaxis-widget"));
    });
  });

  // Top-level page nav
  document.querySelectorAll(".main-tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll(".main-tab").forEach(function (t) { t.classList.remove("active"); });
      document.querySelectorAll(".page").forEach(function (p) { p.classList.add("hidden"); });
      tab.classList.add("active");
      document.getElementById(tab.dataset.target).classList.remove("hidden");
    });
  });
</script>

<script src="fixtures.js"></script>
<script src="matches.js"></script>
<script src="history.js"></script>
<script src="squads.js"></script>
<script src="players.js"></script>

</body>
</html>
